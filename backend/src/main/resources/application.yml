server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/compliance}
    username: ${DB_USER:compliance}
    password: ${DB_PASSWORD:compliance}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

# Allow the Angular dev server and the packaged SPA to call this API.
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080}
